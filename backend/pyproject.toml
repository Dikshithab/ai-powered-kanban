[project]
name = "ai-powered-kanban"
version = "1.0.0"
description = "AI-powered predictive project management platform"
requires-python = "~=3.12.0"

dependencies = [
    "Django==5.2.17",
    "djangorestframework==3.18.1",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "python-dotenv==1.2.3",
    "groq==1.7.0",
    "gunicorn==26.2.0",
    "uvicorn==0.54.0",
    "whitenoise==6.12.0",
    "dj-database-url==3.1.2",
    "psycopg2-binary==2.9.13",
    "Pillow==12.3.0",
    "PyPDF2==3.0.1",
    "python-docx==1.2.0"
]

[tool.vercel.scripts]
build = "python manage.py collectstatic --no-input && python manage.py migrate"